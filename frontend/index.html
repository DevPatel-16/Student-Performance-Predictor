<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Predictor</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }


        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
        }


        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }


        h1 {
            text-align: center;
            margin-bottom: 10px;
        }


        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 18px;
        }


        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }


        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }


        input:focus {
            outline: none;
            border-color: #333;
        }


        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }


        button:hover {
            opacity: 0.9;
        }


        #result {
            text-align: center;
            margin-top: 25px;
            font-size: 24px;
        }


        #error {
            text-align: center;
            margin-top: 15px;
        }

    </style>

</head>


<body>


    <div class="container">

        <div class="card">

            <h1>Student Performance Predictor</h1>

            <p class="description">
                Enter student information to predict the final score.
            </p>


            <form id="predictionForm">


                <div class="form-group">

                    <label for="study_hours">
                        Study Hours per Day
                    </label>

                    <input
                        type="number"
                        id="study_hours"
                        min="1"
                        max="10"
                        step="0.1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="attendance">
                        Attendance (%)
                    </label>

                    <input
                        type="number"
                        id="attendance"
                        min="50"
                        max="100"
                        step="0.1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="previous_score">
                        Previous Score
                    </label>

                    <input
                        type="number"
                        id="previous_score"
                        min="40"
                        max="100"
                        step="0.1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="assignment_score">
                        Assignment Score
                    </label>

                    <input
                        type="number"
                        id="assignment_score"
                        min="40"
                        max="100"
                        step="0.1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="sleep_hours">
                        Sleep Hours
                    </label>

                    <input
                        type="number"
                        id="sleep_hours"
                        min="4"
                        max="12"
                        step="0.1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="participation">
                        Participation Score (1-10)
                    </label>

                    <input
                        type="number"
                        id="participation"
                        min="1"
                        max="10"
                        step="0.1"
                        required
                    >

                </div>


                <button type="submit">
                    Predict Final Score
                </button>


            </form>


            <h2 id="result"></h2>

            <p id="error"></p>


        </div>

    </div>


    <script>

        const form =
            document.getElementById("predictionForm");

        const result =
            document.getElementById("result");

        const error =
            document.getElementById("error");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();


            result.innerText = "Predicting...";
            error.innerText = "";


            const studentData = {

                study_hours:
                    parseFloat(
                        document.getElementById("study_hours").value
                    ),

                attendance:
                    parseFloat(
                        document.getElementById("attendance").value
                    ),

                previous_score:
                    parseFloat(
                        document.getElementById("previous_score").value
                    ),

                assignment_score:
                    parseFloat(
                        document.getElementById("assignment_score").value
                    ),

                sleep_hours:
                    parseFloat(
                        document.getElementById("sleep_hours").value
                    ),

                participation:
                    parseFloat(
                        document.getElementById("participation").value
                    )
            };


            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/predict",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(studentData)
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        "Invalid student data."
                    );

                }


                result.innerText =
                    "Predicted Final Score: " +
                    data.predicted_final_score;


            }

            catch (err) {

                result.innerText = "";

                error.innerText =
                    "Something went wrong. Please check your input and API.";

            }

        });

    </script>


</body>

</html>
